<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Güvenlik — Monelis</title>
  <meta name="description" content="Monelis güvenliği: AES-256 şifreli yerel kasa, bulut yok, izinler kapalı başlar, canlı ortam onayı, kişisel veri maskesi, şifreli yedek, ekip rolleri.">
  <meta name="theme-color" content="#05070c">
  <meta name="color-scheme" content="dark">
  <meta property="og:title" content="Güvenlik — Monelis">
  <meta property="og:description" content="Monelis güvenliği: AES-256 şifreli yerel kasa, bulut yok, izinler kapalı başlar, canlı ortam onayı, kişisel veri maskesi, şifreli yedek, ekip rolleri.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/paylasim.png">
  <link rel="icon" href="assets/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png">
  <link rel="preload" href="assets/yazitipleri/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/yazitipleri/manrope-latin-ext.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/site.css">
  <script src="icerik.js" defer></script>
  <script src="assets/ekranlar/konumlar.js" defer></script>
  <script src="js/tur.js" defer></script>
  <script src="js/sayfalar.js" defer></script>
  <script src="js/site.js" defer></script>
</head>
<body data-sayfa="guvenlik">
  <a class="atla" href="#ana">İçeriğe geç</a>

  <!-- Monelis logosu (tekrar kullanılır; raster: assets/monelis-logo.png) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="kalkan-g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7dd3fc"/><stop offset=".55" stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/>
      </linearGradient>
      <symbol id="kalkan" viewBox="0 0 48 48"><image href="assets/monelis-logo.png" width="48" height="48"/></symbol>
      <symbol id="imlec" viewBox="0 0 24 24"><path d="M5 3l13.5 9.2-6.1 1.2 3.6 6.9-2.6 1.3-3.6-6.9L5 19z" fill="#fff" stroke="#0b1220" stroke-width="1.4" stroke-linejoin="round"/></symbol>
    </defs>
  </svg>

  <header class="ust" id="ust"></header>

  <main id="ana">
    <section class="sayfa-bas" aria-labelledby="sayfa-baslik">
      <div class="izgara-zemin" aria-hidden="true"></div>
      <div class="imlec-isigi" aria-hidden="true"></div>
      <div class="sayfa-bas-ic">
        <span class="ust-etiket" data-metin="guvenlikSayfa.ust"></span>
        <h1 id="sayfa-baslik" class="sayfa-baslik" data-metin="guvenlikSayfa.baslik"></h1>
        <p class="sayfa-alt" data-metin="guvenlikSayfa.alt"></p>
        <div class="bas-kasa" aria-hidden="true">
          <svg viewBox="0 0 120 140"><path class="kilit-kol" d="M34 64V44a26 26 0 0 1 52 0v20" fill="none" stroke="url(#kalkan-g)" stroke-width="9" stroke-linecap="round"/><rect x="16" y="62" width="88" height="70" rx="16" fill="rgba(56,189,248,.1)" stroke="url(#kalkan-g)" stroke-width="3"/><circle cx="60" cy="92" r="8" fill="#38bdf8"/><path d="M60 98v14" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/></svg>
        </div>
      </div>
    </section>
    <div class="guvenlik-bloklari" id="guvenlik-bloklari"></div>
    <section class="kapanis kapanis-kucuk" aria-labelledby="kapanis-baslik">
      <div class="izgara-zemin" aria-hidden="true"></div>
      <div class="kapanis-ic gorun">
        <h2 id="kapanis-baslik" data-metin="kapanis.baslik"></h2>
        <p data-metin="kapanis.alt"></p>
        <button class="dugme dugme-ana izle-ac" type="button" data-manyetik>
          <span data-metin="kapanis.dugme">İzle</span>
          <span class="oynat-daire" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg></span>
        </button>
      </div>
    </section>
  </main>

  <footer class="alt" id="alt"></footer>
  <noscript><p class="noscript">Monelis verinizi kendi bilgisayarınızda, AES-256 şifreli kasada tutar; bulut yoktur, izinler kapalı başlar.</p></noscript>
</body>
</html>
